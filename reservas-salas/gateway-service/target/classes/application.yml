server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/api/auth/**
          filters:
            - RewritePath=/api/auth/(?<segment>.*), /auth/${segment}
        - id: salas-service
          uri: ${SALAS_SERVICE_URI:http://localhost:8082}
          predicates:
            - Path=/api/salas/**
          filters:
            - RewritePath=/api/salas/(?<segment>.*), /salas/${segment}
        - id: reservas-service
          uri: ${RESERVAS_SERVICE_URI:http://localhost:8083}
          predicates:
            - Path=/api/reservas/**
          filters:
            - RewritePath=/api/reservas/(?<segment>.*), /reservas/${segment}

jwt: # JwtAuthFilter
  secret: ${JWT_SECRET:trabalho-microsservicos-chave-secreta-hs256-2026-udesc}
