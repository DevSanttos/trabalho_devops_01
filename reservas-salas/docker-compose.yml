version: "3.8"

services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"

  auth-service:
    build: ./auth-service
    ports:
      - "8081:8081"

  salas-service:
    build: ./salas-service
    ports:
      - "8082:8082"

  reservas-service:
    build: ./reservas-service
    ports:
      - "8083:8083"
    environment:
      SALAS_SERVICE_URL: http://salas-service:8082
      SPRING_RABBITMQ_HOST: rabbitmq
    depends_on:
      - salas-service
      - rabbitmq

  notificacao-service:
    build: ./notificacao-service
    ports:
      - "8084:8084"
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
    depends_on:
      - rabbitmq

  gateway-service:
    build: ./gateway-service
    ports:
      - "8080:8080"
    environment:
      AUTH_SERVICE_URI: http://auth-service:8081
      SALAS_SERVICE_URI: http://salas-service:8082
      RESERVAS_SERVICE_URI: http://reservas-service:8083
    depends_on:
      - auth-service
      - salas-service
      - reservas-service
